<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16181f" />
  <title>SubmitReady — Make any document ready to submit</title>
  <meta
    name="description"
    content="SubmitReady is a free, browser-based toolkit to compress images, resize photos and signatures, convert images to PDF, compress, merge and split PDFs, and validate every file against upload requirements. Free accounts add a workspace and saved presets."
  />
  <!--
    The canonical URL is rewritten per route by useSeo() at runtime; this tag is
    the fallback for the landing page. `vite-ignore` is required: Vite treats the
    href of every <link> as a build asset, and "/" resolves to the project root
    directory, which makes the production build fail with EISDIR.
  -->
  <link rel="canonical" href="/" vite-ignore />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SubmitReady",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any (browser)",
      "description": "Browser-based document preparation toolkit: compress and resize images, convert images to PDF, compress, merge and split PDFs, and validate files against upload requirements. Optional accounts keep a workspace of run history and reusable requirement presets.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
  </script>
</head>


<body>
  <script>
    // Dark is the default surface; only an explicit light choice switches it.
    (function () {
      try {
        var light = localStorage.getItem("submitready-theme") === "light";
        document.documentElement.classList.toggle("light", light);
        document.documentElement.classList.toggle("dark", !light);
      } catch (error) {
        /* ignore */
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
